<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vision B4 Da Bag – Design Tool</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #111, #222, #111);
      color: #fff;
      text-align: center;
    }

    header {
      padding: 25px 0;
      background: #000;
      border-bottom: 3px solid #d4af37;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 2px;
      color: #d4af37;
      font-weight: 700;
      text-transform: uppercase;
    }

    header p {
      margin: 5px 0 0;
      font-size: 16px;
      color: #ccc;
    }

    .container {
      margin-top: 30px;
    }

    #upload {
      margin: 20px auto;
      padding: 10px;
      background: #d4af37;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      color: #000;
      font-weight: bold;
    }

    .controls {
      margin: 20px 0;
    }

    .controls button {
      margin: 0 8px;
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: #fff;
      transition: 0.2s;
      border: 1px solid #555;
    }

    .controls button:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    .template-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    .template {
      width: 1200px;
      height: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      background: #444;
    }

    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(25px);
      transform: scale(1.2);
      display: none;
    }

    #photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      cursor: grab;
    }
  </style>
</head>

<body>

<header>
  <h1>Vision B4 Da Bag</h1>
  <p>Custom Tumblers • T‑Shirts • Hats • License Plate Prints</p>
</header>

<div class="container">
  <input type="file" id="upload" accept="image/*">

  <div class="controls">
    <button id="modeCrop">Auto Crop</button>
    <button id="modeBlur">Blur Background</button>
    <button id="modeColor">Solid Color Fill</button>
  </div>

  <div class="template-wrapper">
    <div class="template">
      <div id="background"></div>
      <img id="photo" src="">
    </div>
  </div>
</div>

<script>
  const upload = document.getElementById("upload");
  const photo = document.getElementById("photo");
  const background = document.getElementById("background");

  upload.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    photo.src = url;
    background.style.backgroundImage = `url(${url})`;

    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  let dragging = false;
  let startX, startY;

  photo.addEventListener("mousedown", e => {
    if (!photo.src) return;
    dragging = true;
    startX = e.clientX - photo.offsetLeft;
    startY = e.clientY - photo.offsetTop;
    photo.style.cursor = "grabbing";
  });

  document.addEventListener("mousemove", e => {
    if (dragging) {
      photo.style.left = (e.clientX - startX) + "px";
      photo.style.top = (e.clientY - startY) + "px";
    }
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    photo.style.cursor = "grab";
  });

  document.getElementById("modeCrop").onclick = () => {
    background.style.display = "none";
    background.style.filter = "blur(25px)";
    photo.style.width = "100%";
    photo.style.height = "auto";
  };

  document.getElementById("modeBlur").onclick = () => {
    if (!photo.src) return;
    background.style.display = "block";
    background.style.filter = "blur(25px)";
    background.style.backgroundColor = "transparent";
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  document.getElementById("modeColor").onclick = () => {
    background.style.display = "block";
    background.style.filter = "none";
    background.style.backgroundImage = "none";
    background.style.backgroundColor = "#222";
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };
</script>

</body>
</html>
