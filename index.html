<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vision B4 Da Bag – Design Studio</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      text-align: center;
    }

    header {
      padding: 30px 0 20px;
      background: #000;
      border-bottom: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      margin: 0 auto 10px;
      border: 3px solid #d4af37;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .tagline {
      margin-top: 8px;
      font-size: 18px;
      color: #ccc;
      font-style: italic;
    }

    .motto {
      margin-top: 5px;
      font-size: 15px;
      color: #999;
    }

    .contact {
      margin-top: 10px;
      font-size: 14px;
      color: #777;
    }

    .container {
      margin-top: 30px;
    }

    #upload {
      margin: 20px auto;
      padding: 12px 18px;
      background: #d4af37;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      color: #000;
      font-weight: bold;
    }

    .template-select {
      margin: 20px 0;
      font-size: 16px;
    }

    .template-select select {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      background: #111;
      color: #d4af37;
      font-size: 16px;
    }

    .controls {
      margin: 20px 0;
    }

    .controls button {
      margin: 0 8px;
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: #fff;
      transition: 0.2s;
      border: 1px solid #555;
    }

    .controls button:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }

    .template-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 25px;
      margin-bottom: 40px;
    }

    .template {
      width: 1200px;
      height: 600px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
      background: #444;
    }

    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(25px);
      transform: scale(1.2);
      display: none;
    }

    #photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      cursor: grab;
    }

    footer {
      padding: 20px 0 30px;
      font-size: 13px;
      color: #777;
    }

    /* PRINT MODE */
    @media print {
      body * {
        visibility: hidden;
      }
      .template, .template * {
        visibility: visible;
      }
      .template {
        position: absolute;
        top: 0;
        left: 0;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>

<body>

<header>
  <!-- Upload your logo file to GitHub and replace the URL below -->
  <div class="logo" style="background-image: url('logo.png');"></div>

  <h1>Vision B4 Da Bag</h1>

  <div class="tagline">Streetwear for the grinders, hustlers, and entrepreneurs.</div>
  <div class="motto">Have the vision first… the bag comes after.</div>
  <div class="contact">Contact: visionb4dabag@gmail.com</div>
</header>

<div class="container">
  <input type="file" id="upload" accept="image/*">

  <div class="template-select">
    <label>Select Template:</label>
    <select id="templatePicker">
      <option value="plate">6x12 License Plate</option>
      <option value="20oz">20oz Tumbler</option>
      <option value="30oz">30oz Tumbler</option>
      <option value="hat">Hat Print</option>
      <option value="shirt">T‑Shirt Print</option>
    </select>
  </div>

  <div class="controls">
    <button id="modeCrop">Auto Crop</button>
    <button id="modeBlur">Blur Background</button>
    <button id="modeColor">Solid Color Fill</button>
    <button id="printBtn">Print</button>
  </div>

  <div class="template-wrapper">
    <div class="template">
      <div id="background"></div>
      <img id="photo" src="">
    </div>
  </div>
</div>

<footer>
  © Vision B4 Da Bag — Custom Apparel & Printing Service
</footer>

<script>
  const upload = document.getElementById("upload");
  const photo = document.getElementById("photo");
  const background = document.getElementById("background");
  const templatePicker = document.getElementById("templatePicker");
  const templateBox = document.querySelector(".template");

  function updateTemplateSize(type) {
    switch(type) {
      case "plate":
        templateBox.style.width = "1200px";
        templateBox.style.height = "600px";
        break;
      case "20oz":
        templateBox.style.width = "930px";
        templateBox.style.height = "820px";
        break;
      case "30oz":
        templateBox.style.width = "1030px";
        templateBox.style.height = "950px";
        break;
      case "hat":
        templateBox.style.width = "400px";
        templateBox.style.height = "250px";
        break;
      case "shirt":
        templateBox.style.width = "1200px";
        templateBox.style.height = "1600px";
        break;
    }

    photo.style.left = "0px";
    photo.style.top = "0px";
  }

  templatePicker.onchange = () => {
    updateTemplateSize(templatePicker.value);
  };

  updateTemplateSize("plate");

  upload.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    photo.src = url;
    background.style.backgroundImage = `url(${url})`;

    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  let dragging = false;
  let startX, startY;

  photo.addEventListener("mousedown", e => {
    if (!photo.src) return;
    dragging = true;
    startX = e.clientX - photo.offsetLeft;
    startY = e.clientY - photo.offsetTop;
    photo.style.cursor = "grabbing";
  });

  document.addEventListener("mousemove", e => {
    if (dragging) {
      photo.style.left = (e.clientX - startX) + "px";
      photo.style.top = (e.clientY - startY) + "px";
    }
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    photo.style.cursor = "grab";
  });

  document.getElementById("modeCrop").onclick = () => {
    background.style.display = "none";
    background.style.filter = "blur(25px)";
    photo.style.width = "100%";
    photo.style.height = "auto";
  };

  document.getElementById("modeBlur").onclick = () => {
    if (!photo.src) return;
    background.style.display = "block";
    background.style.filter = "blur(25px)";
    background.style.backgroundColor = "transparent";
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  document.getElementById("modeColor").onclick = () => {
    background.style.display = "block";
    background.style.filter = "none";
    background.style.backgroundImage = "none";
    background.style.backgroundColor = "#222";
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  document.getElementById("printBtn").onclick = () => {
    window.print();
  };
</script>

</body>
</html>
