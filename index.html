<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vision B4 Da Bag – Design Tool</title>
  <style>
    :root{
      --gold:#d4af37;
      --bg1:#111; --bg2:#222; --panel:#2b2b2b;
      --card:#444; --muted:#ccc; --accent:#d4af37;
    }
    html,body{height:100%;}
    body{
      margin:0;padding:0;font-family:Inter, "Segoe UI", Arial, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    header{padding:22px 16px;background:#000;border-bottom:3px solid var(--gold);}
    header .brand{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px}
    header h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:1px}
    header p{margin:0;color:var(--muted);font-size:13px}

    .app{max-width:1200px;margin:28px auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}

    /* left controls */
    .panel{background:linear-gradient(180deg,var(--panel),#222);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    .panel h2{margin:0 0 12px 0;font-size:15px;color:var(--gold)}
    input[type=file]{display:block;width:100%;padding:10px;border-radius:6px;border:0;background:var(--gold);color:#000;font-weight:700;cursor:pointer}

    .controls{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .controls label{font-size:13px;color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center}
    select,input[type=color],button{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#333;color:#fff}
    .small{font-size:13px}

    .btn{background:var(--gold);color:#000;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}

    .hint{font-size:12px;color:#bfbfbf}

    /* template area */
    .canvas-wrap{display:flex;justify-content:center;align-items:center}
    .template{
      width:100%;max-width:1200px;background:var(--card);border-radius:12px;border:3px solid var(--gold);overflow:hidden;position:relative;
      box-shadow:0 6px 30px rgba(0,0,0,0.6);aspect-ratio:2/1; /* responsive 1200x600 ratio */
    }

    /* photo area implemented as background-layer for easier pan/zoom and object-fit:cover behavior */
    .photo-layer{
      position:absolute;inset:0;background-size:cover;background-position:50% 50%;background-repeat:no-repeat;transition:background-position .08s linear;
    }

    .overlay{position:absolute;inset:0;pointer-events:none}

    .template .frame{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.9);
      font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:20px;pointer-events:none
    }

    /* footer controls inside template */
    .template .controls-inline{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;pointer-events:auto}
    .template .controls-inline button{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:8px;border-radius:8px}

    /* responsive */
    @media(max-width:900px){.app{grid-template-columns:1fr;}.panel{order:2}.template{order:1}}
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <h1>Vision B4 Da Bag</h1>
      <p>Design Tool — Professional templates for prints</p>
    </div>
  </div>
</header>

<main class="app">
  <aside class="panel" aria-labelledby="controls-title">
    <h2 id="controls-title">Image & Output Controls</h2>

    <input id="upload" type="file" accept="image/*" aria-label="Upload photo">
    <div class="controls">
      <div>
        <label class="small">Fit mode</label>
        <div class="row"><select id="fitMode" class="small" title="How the photo fills the template"><option value="cover" selected>Fill (cover) — fills template without distortion</option><option value="contain">Fit (contain) — show whole image (may letterbox)</option></select></div>
      </div>

      <div>
        <label class="small">Background</label>
        <div class="row">
          <button id="bgBlur" class="small">Blur photo background</button>
          <button id="bgColorBtn" class="small">Solid color</button>
          <input id="bgColor" type="color" value="#222" title="Background color" style="display:none">
        </div>
      </div>

      <div>
        <label class="small">Zoom</label>
        <div class="row"><input id="zoom" type="range" min="100" max="300" value="100"></div>
        <div class="hint">Use zoom and drag to position focal point</div>
      </div>

      <div>
        <label class="small">Export</label>
        <div class="row">
          <button id="download" class="btn">Download PNG</button>
          <button id="reset" class="small">Reset</button>
        </div>
      </div>

      <div class="hint" style="margin-top:8px">Tip: Choose "Fill (cover)" to stretch the photo to the template without distortion. Drag inside the preview to reposition.</div>
    </div>
  </aside>

  <section class="canvas-wrap">
    <div id="template" class="template" role="img" aria-label="Preview template">
      <div id="backgroundLayer" class="photo-layer" style="z-index:1;background-size:cover;"></div>
      <div id="photoLayer" class="photo-layer" style="z-index:2;"></div>

      <div class="frame">License Plate Print</div>

      <div class="controls-inline" aria-hidden="true">
        <button id="btnFit">Fit</button>
        <button id="btnCover">Cover</button>
      </div>
    </div>
  </section>
</main>

<script>
  // elements
  const upload = document.getElementById('upload');
  const template = document.getElementById('template');
  const photoLayer = document.getElementById('photoLayer');
  const backgroundLayer = document.getElementById('backgroundLayer');
  const fitMode = document.getElementById('fitMode');
  const zoom = document.getElementById('zoom');
  const bgBlurBtn = document.getElementById('bgBlur');
  const bgColorBtn = document.getElementById('bgColorBtn');
  const bgColor = document.getElementById('bgColor');
  const downloadBtn = document.getElementById('download');
  const resetBtn = document.getElementById('reset');

  let img = new Image();
  let imgURL = '';
  let naturalW = 0, naturalH = 0;

  // state for panning/position in percent (0-100)
  const pos = {x:50,y:50};

  // background mode
  let useBlurBg = false;
  let useSolidBg = false;

  function updateLayers(){
    if(!imgURL) return;
    const sizePercent = zoom.value + '%';
    // set background and photo layers
    backgroundLayer.style.backgroundImage = `url(${imgURL})`;
    photoLayer.style.backgroundImage = `url(${imgURL})`;

    // background styling
    if(useSolidBg){
      backgroundLayer.style.backgroundImage = 'none';
      backgroundLayer.style.backgroundColor = bgColor.value;
      backgroundLayer.style.filter = 'none';
      backgroundLayer.style.backgroundSize = 'cover';
    } else {
      backgroundLayer.style.backgroundColor = 'transparent';
      backgroundLayer.style.backgroundSize = (fitMode.value==='contain')? 'contain' : sizePercent;
      backgroundLayer.style.filter = useBlurBg ? 'blur(14px) brightness(.9)' : 'none';
      backgroundLayer.style.transform = useBlurBg ? 'scale(1.05)' : 'none';
    }

    // photo layer styling
    photoLayer.style.backgroundSize = (fitMode.value === 'contain') ? 'contain' : sizePercent;
    photoLayer.style.backgroundPosition = `${pos.x}% ${pos.y}%`;
    backgroundLayer.style.backgroundPosition = `${pos.x}% ${pos.y}%`;
  }

  upload.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    imgURL = URL.createObjectURL(file);
    img = new Image();
    img.onload = () => { naturalW = img.naturalWidth; naturalH = img.naturalHeight; }
    img.src = imgURL;
    // reset
    pos.x = 50; pos.y = 50; zoom.value = 100; useBlurBg = false; useSolidBg = false; bgColor.style.display = 'none';
    updateLayers();
  });

  // fit mode quick buttons
  document.getElementById('btnFit').addEventListener('click', ()=>{fitMode.value='contain'; updateLayers();});
  document.getElementById('btnCover').addEventListener('click', ()=>{fitMode.value='cover'; updateLayers();});
  fitMode.addEventListener('change', updateLayers);
  zoom.addEventListener('input', updateLayers);

  bgBlurBtn.addEventListener('click', ()=>{useBlurBg = !useBlurBg; useSolidBg = false; bgColor.style.display = 'none'; updateLayers(); bgBlurBtn.style.opacity = useBlurBg?1:0.7});
  bgColorBtn.addEventListener('click', ()=>{useSolidBg = !useSolidBg; useBlurBg = false; bgColor.style.display = useSolidBg? 'inline-block':'none'; updateLayers(); bgColorBtn.style.opacity = useSolidBg?1:0.7});
  bgColor.addEventListener('input', updateLayers);

  resetBtn.addEventListener('click', ()=>{pos.x=50;pos.y=50;zoom.value=100;useBlurBg=false;useSolidBg=false;bgColor.style.display='none';updateLayers();});

  // panning: translate pointer movement to background-position percent
  let dragging=false; let start={x:0,y:0};
  template.addEventListener('pointerdown', e=>{
    if(!imgURL) return;
    dragging = true; template.setPointerCapture(e.pointerId); start.x = e.clientX; start.y = e.clientY; start.px = pos.x; start.py = pos.y;
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect = template.getBoundingClientRect();
    // convert movement to percent relative to width/height
    const dx = (e.clientX - start.x) / rect.width * 100;
    const dy = (e.clientY - start.y) / rect.height * 100;
    pos.x = Math.max(0, Math.min(100, start.px + dx));
    pos.y = Math.max(0, Math.min(100, start.py + dy));
    updateLayers();
  });
  window.addEventListener('pointerup', e=>{dragging=false});

  // download: render to canvas at template aspect ratio, use 2400x1200 for high quality
  downloadBtn.addEventListener('click', async ()=>{
    if(!imgURL) return alert('Please upload an image first');
    const outW = 2400, outH = 1200; // double resolution
    const canvas = document.createElement('canvas'); canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');

    // draw background (either blurred photo or solid color)
    if(useSolidBg){
      ctx.fillStyle = bgColor.value; ctx.fillRect(0,0,outW,outH);
    } else if(imgURL){
      // draw blurred background scaled to cover
      const tmp = await loadImage(imgURL);
      const scaleBg = Math.max(outW/tmp.naturalWidth, outH/tmp.naturalHeight);
      const dispW = tmp.naturalWidth*scaleBg, dispH = tmp.naturalHeight*scaleBg;
      const posX = (pos.x/100)*(dispW - outW);
      const posY = (pos.y/100)*(dispH - outH);
      // draw blurred
      ctx.save(); ctx.filter = useBlurBg ? 'blur(12px) brightness(.9)' : 'none';
      ctx.drawImage(tmp, -posX, -posY, dispW, dispH);
      ctx.restore();
    }

    // draw main photo area according to fitMode and zoom/position
    const main = await loadImage(imgURL);
    let scale;
    if(fitMode.value==='contain'){
      scale = Math.min(outW/main.naturalWidth, outH/main.naturalHeight) * (zoom.value/100);
      const dispW = main.naturalWidth*scale, dispH = main.naturalHeight*scale;
      const offsetX = (outW - dispW)/2; const offsetY = (outH - dispH)/2;
      ctx.drawImage(main, 0,0, main.naturalWidth, main.naturalHeight, offsetX, offsetY, dispW, dispH);
    } else {
      // cover: scale so image covers canvas, then crop according to pos
      scale = Math.max(outW/main.naturalWidth, outH/main.naturalHeight) * (zoom.value/100);
      const dispW = main.naturalWidth*scale, dispH = main.naturalHeight*scale;
      const maxOffsetX = Math.max(0, dispW - outW);
      const maxOffsetY = Math.max(0, dispH - outH);
      const offsetX = - (pos.x/100) * maxOffsetX;
      const offsetY = - (pos.y/100) * maxOffsetY;
      ctx.drawImage(main, offsetX, offsetY, dispW, dispH);
    }

    // export
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a'); a.href = url; a.download = 'visionb4dabag-print.png'; a.click();
  });

  function loadImage(src){
    return new Promise((res,rej)=>{const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src;});
  }

  // initialize appearance
  updateLayers();
</script>
</body>
</html>
