<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>6x12 License Plate Image Fitter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 10px;
    }

    #upload {
      margin-bottom: 15px;
    }

    .controls {
      margin-bottom: 15px;
    }

    .controls button {
      margin-right: 10px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .template {
      width: 1200px;   /* 6x12 at 100px per inch */
      height: 600px;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
      background: #ddd;
    }

    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px);
      transform: scale(1.2);
      display: none;
    }

    #photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto; /* prevents distortion */
      cursor: grab;
    }
  </style>
</head>
<body>

<h2>6x12 License Plate Image Fitter</h2>

<input type="file" id="upload" accept="image/*">

<div class="controls">
  <button id="modeCrop">Auto Crop</button>
  <button id="modeBlur">Blur Background</button>
  <button id="modeColor">Solid Color Fill</button>
</div>

<div class="template">
  <div id="background"></div>
  <img id="photo" src="">
</div>

<script>
  const upload = document.getElementById("upload");
  const photo = document.getElementById("photo");
  const background = document.getElementById("background");

  // Load image
  upload.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    photo.src = url;
    background.style.backgroundImage = `url(${url})`;

    // Reset position
    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  // Dragging
  let dragging = false;
  let startX, startY;

  photo.addEventListener("mousedown", e => {
    if (!photo.src) return;
    dragging = true;
    startX = e.clientX - photo.offsetLeft;
    startY = e.clientY - photo.offsetTop;
    photo.style.cursor = "grabbing";
  });

  document.addEventListener("mousemove", e => {
    if (dragging) {
      photo.style.left = (e.clientX - startX) + "px";
      photo.style.top = (e.clientY - startY) + "px";
    }
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    photo.style.cursor = "grab";
  });

  // Modes
  document.getElementById("modeCrop").onclick = () => {
    background.style.display = "none";
    background.style.filter = "blur(20px)";
    photo.style.width = "100%";
    photo.style.height = "auto";
  };

  document.getElementById("modeBlur").onclick = () => {
    if (!photo.src) return;
    background.style.display = "block";
    background.style.filter = "blur(20px)";
    background.style.backgroundColor = "transparent";
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };

  document.getElementById("modeColor").onclick = () => {
    background.style.display = "block";
    background.style.filter = "none";
    background.style.backgroundImage = "none";
    background.style.backgroundColor = "#444"; // change this for different solid colors
    photo.style.width = "auto";
    photo.style.height = "100%";
    photo.style.left = "0px";
    photo.style.top = "0px";
  };
</script>

</body>
</html>
